# Optional: run PostgreSQL in Docker instead of a local install.
# docker compose up -d   ->  DATABASE_URL="postgresql://postgres:postgres@localhost:5434/loreal_claims?schema=public"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loreal_claims
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
